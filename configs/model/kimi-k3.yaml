# @package _global_
profile: kimi-k3
model:
  agent: harbor_adapter.agents.kimi_code:FactorizationKimiCode
  model: moonshotai/kimi-k3
  kwargs:
    version: 0.43.0
  api_key_env: OPENROUTER_API_KEY
  key_target: KIMI_MODEL_API_KEY
  url_target: KIMI_MODEL_BASE_URL
  env:
    KIMI_MODEL_BASE_URL: https://openrouter.ai/api/v1
    KIMI_MODEL_PROVIDER_TYPE: openai
    KIMI_MODEL_MAX_CONTEXT_SIZE: '1048576'
    KIMI_MODEL_CAPABILITIES: image_in,thinking
    KIMI_MODEL_THINKING_EFFORT: high
    KIMI_CODE_EXPERIMENTAL_FLAG: 'true'
